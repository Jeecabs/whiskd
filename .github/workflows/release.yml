name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # asset names match `$(uname -m)-$(uname -s | tr A-Z a-z)` for the README one-liner
          - { os: macos-latest, target: aarch64-apple-darwin, asset: arm64-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: x86_64-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: x86_64-linux }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: aarch64-linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf whiskd-${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release whiskd
      - uses: actions/upload-artifact@v4
        with:
          name: whiskd-${{ matrix.asset }}
          path: whiskd-${{ matrix.asset }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" whiskd-*.tar.gz --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
